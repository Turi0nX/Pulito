name: Update public blocker lists (public-lists branch)

on:
  schedule:
    # Ogni 2 giorni alle 03:00 UTC
    - cron: "0 3 */2 * *"
    
  workflow_dispatch: {}

jobs:
  update-lists:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: Backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Restore private key from Secret
        working-directory: Backend
        env:
          PULITO_PRIVKEY: ${{ secrets.PULITO_PRIVKEY }}
        run: |
          mkdir -p keys
          echo "$PULITO_PRIVKEY" > keys/pulito_privkey.pem

      - name: Generate blocker lists (base + pro)
        working-directory: Backend
        run: |
          python -m generator.cli
          ls -la output/

      - name: Checkout public-lists branch
        uses: actions/checkout@v4
        with:
          ref: public-lists
          path: public-lists
          fetch-depth: 0

      - name: Clean public-lists and copy output
        run: |
          cd public-lists
          find . -maxdepth 1 -not -name '.git' -not -name '.' -exec rm -rf {} +
          mkdir -p Backend/output
          cd ..
          cp Backend/output/blockerList_base.json  public-lists/Backend/output/
          cp Backend/output/blockerList_pro.json   public-lists/Backend/output/
          cp Backend/output/manifest_base.json     public-lists/Backend/output/
          cp Backend/output/manifest_pro.json      public-lists/Backend/output/

      - name: Commit and push to public-lists
        working-directory: public-lists
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f .
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: auto-update public blocker lists"
            git push origin HEAD:public-lists
          fi