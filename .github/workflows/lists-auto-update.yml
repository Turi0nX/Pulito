name: Update blocker lists

on:
  schedule:
    # Ogni 2 giorni alle 03:00 UTC
    - cron: "0 3 */2 * *"
  
  workflow_dispatch: {}

jobs:
  update-lists:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: Backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Generate blocker lists (base + pro)
        working-directory: Backend
        run: |
          python -m generator.cli

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Backend/output/blockerList_base.json \
                  Backend/output/blockerList_pro.json \
                  Backend/output/manifest_base.json \
                  Backend/output/manifest_pro.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: auto-update blocker lists"
            git push
          fi